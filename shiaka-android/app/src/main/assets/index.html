<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f5;--card:#fff;--ink:#14213d;--mut:#6b7689;--line:#dde2ea;--pri:#1593e8;--pri-ink:#fff;--acc:#f2a541;--bad:#c0392b;--ok:#1e8e5a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1624;--card:#18223a;--ink:#e8edf6;--mut:#98a3b8;--line:#2a3652;--pri:#2bb3b1;--pri-ink:#04201f;--bad:#ff7a6b;--ok:#47c98a}}
:root[data-theme="dark"]{--bg:#0f1624;--card:#18223a;--ink:#e8edf6;--mut:#98a3b8;--line:#2a3652;--pri:#2bb3b1;--pri-ink:#04201f;--bad:#ff7a6b;--ok:#47c98a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Tajawal,Tahoma,Arial,sans-serif;font-size:15px}
.shell{display:flex;min-height:100vh}
.side{width:210px;background:var(--card);border-inline-end:1px solid var(--line);padding:14px 10px;flex-shrink:0}
.logo{font-weight:800;font-size:20px;color:var(--pri);padding:6px 10px 16px}
.side button{display:block;width:100%;text-align:right;background:none;border:0;padding:10px 12px;border-radius:8px;cursor:pointer;font:inherit;margin-bottom:2px;color:var(--ink)}
.side button.on{background:color-mix(in srgb,var(--pri) 14%,transparent);color:var(--pri);font-weight:700}
.content{flex:1;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;background:var(--card);border-bottom:1px solid var(--line);padding:10px 18px}
main{padding:16px;max-width:1300px;margin:auto}
@media(max-width:700px){.shell{flex-direction:column}.side{width:100%;display:flex;overflow-x:auto;gap:4px;align-items:center}.logo{display:none}#nav{display:flex;gap:4px}.side button{width:auto;white-space:nowrap}}
.hello{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.hello h2{margin:0;font-size:22px}.hello span{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:6px 12px;font-size:13px;color:var(--mut)}
.k4{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:12px}
.kpi{border-radius:10px;padding:16px;color:#fff}.kpi span{font-size:13px;opacity:.9}.kpi b{display:block;font-size:26px;margin-top:6px}
.c1{background:var(--pri)}.c2{background:#13a58a}.c3{background:#14213d}.c4{background:#2f5bea}
.mini{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}.mini b{display:block;font-size:22px}.mini span{color:var(--mut);font-size:13px}
.dg{display:grid;grid-template-columns:2fr 1fr;gap:12px;margin-bottom:12px}.dg3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:900px){.dg,.dg3{grid-template-columns:1fr}}
.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.ch h4{margin:0}
.tabs{display:flex;gap:4px}.tabs button{border:1px solid var(--line);background:var(--bg);padding:4px 12px;border-radius:6px;cursor:pointer}.tabs button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.bars{display:flex;align-items:flex-end;gap:8px;height:200px;border-bottom:1px solid var(--line);padding:0 6px}
.bars div{flex:1;background:#7fc4f3;border-radius:4px 4px 0 0;min-height:2px}
.bl{display:flex;gap:8px;padding:4px 6px;font-size:12px;color:var(--mut)}.bl span{flex:1;text-align:center}
.donut{width:150px;height:150px;border-radius:50%;margin:14px auto;position:relative}.donut::after{content:"";position:absolute;inset:34px;background:var(--card);border-radius:50%}
.li{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
input,select,button{font:inherit;color:inherit}
input,select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--pri);outline-offset:1px}
.btn{background:var(--pri);color:var(--pri-ink);border:0;border-radius:8px;padding:10px 16px;font-weight:700;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.bad{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px}
.pos{display:grid;grid-template-columns:1fr 380px;gap:16px}
@media(max-width:900px){.pos{grid-template-columns:1fr}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px}
.prod{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;text-align:right;cursor:pointer}
.prod:hover{border-color:var(--pri)}
.prod b{display:block;margin-bottom:6px}
.prod span{color:var(--mut);font-size:13px}
.price{color:var(--pri);font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:20px;padding:6px 12px;cursor:pointer;font-size:14px}
.chip:hover:not(:disabled){border-color:var(--pri);color:var(--pri)}
.chip:disabled{opacity:.4;cursor:not-allowed}
.picker{background:var(--bg);border:2px solid var(--pri);border-radius:10px;padding:12px;margin-top:12px}
.line{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.line small{color:var(--mut);display:block}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:28px;height:28px;border-radius:6px;border:1px solid var(--line);background:var(--bg);cursor:pointer}
.tot{display:flex;justify-content:space-between;padding:5px 0}
.tot.big{font-size:22px;font-weight:800;border-top:2px solid var(--ink);margin-top:6px;padding-top:10px}
.row{display:flex;gap:8px;margin-top:8px}
table{width:100%;border-collapse:collapse}
th,td{text-align:right;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mut);font-weight:500;font-size:13px}
.low{color:var(--bad);font-weight:700}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.stat b{display:block;font-size:24px;margin-top:4px}
.stat span{color:var(--mut);font-size:13px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:10px}
label{font-size:13px;color:var(--mut);display:block;margin-bottom:4px}
.empty{color:var(--mut);text-align:center;padding:24px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:9;padding:16px}
.rcpt{background:#fff;color:#111;width:320px;max-height:78vh;overflow:auto;border-radius:8px;padding:18px;font-size:14px}
.rcpt h3{text-align:center;margin:0 0 4px}
.rcpt hr{border:0;border-top:1px dashed #888}
.rcpt .r{display:flex;justify-content:space-between;gap:8px;padding:2px 0}
.hide{display:none!important}
.card,.mini{box-shadow:0 1px 3px rgba(20,33,61,.07)}
.kpi{box-shadow:0 4px 12px rgba(20,33,61,.15)}
.side button{display:flex;align-items:center;gap:10px;padding:12px;font-size:15px;transition:background .15s}
.side button:hover{background:var(--bg)}
.side button.on{border-inline-start:3px solid var(--pri);background:color-mix(in srgb,var(--pri) 12%,transparent)}
.btn{transition:filter .15s}.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.5;cursor:not-allowed}
#srch{padding:13px 16px;font-size:16px;border-radius:10px}
.prod{padding:0;overflow:hidden;transition:transform .15s,box-shadow .15s}
.prod:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(20,33,61,.14)}
.prod>*{margin-inline:12px}
.prod>.tile{margin:0;height:72px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:32px;font-weight:800}
.prod b{margin-top:10px}
.prod .price{margin-bottom:6px}
.badge{display:inline-block;margin-bottom:12px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:2px 10px}
.pos aside{position:sticky;top:12px;align-self:start}
.tot.big{color:var(--pri)}
.row .btn{padding:13px 16px;font-size:16px}
th{background:var(--bg);font-weight:700}
tr:hover td{background:color-mix(in srgb,var(--pri) 5%,transparent)}
.top{box-shadow:0 1px 3px rgba(20,33,61,.06)}
.logo{display:flex;align-items:center;gap:10px;line-height:1.1}.logo small{display:block;font-size:13px;color:var(--mut);font-weight:500}
.pimg{width:52px;height:52px;object-fit:cover;border-radius:8px;vertical-align:middle;margin:6px 0 0;margin-inline-end:8px}
td .pimg{margin:0 0 0 8px}
.prod>.tile{height:100px}
.lg-ov{position:fixed;inset:0;z-index:99;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px}
.lgbox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:26px;width:340px;max-width:100%;text-align:center;display:flex;flex-direction:column;align-items:stretch;gap:10px;box-shadow:0 8px 30px rgba(20,33,61,.15)}.lgbox svg{align-self:center}
.role-cashier .mgr{display:none!important}
.lblwrap{display:flex;flex-wrap:wrap;gap:6px}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.pos aside .row{flex-wrap:wrap}
.tm{font-size:17px}.tm .btn{padding:14px 18px}.tm .btn.sm{padding:10px 14px}.tm .grid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}.tm input,.tm select{padding:13px}.tm .chip{padding:11px 18px;font-size:16px}.tm .qty button{width:44px;height:44px}.tm .side button{padding:15px 12px}.tm .prod>.tile{height:120px}
.card .r{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:3px 0}
.lbl{width:50mm;height:30mm;box-sizing:border-box;padding:1.2mm;text-align:center;font-size:7px;line-height:1.15;overflow:hidden;color:#000;background:#fff;border:1px dashed #bbb}
.kpi{position:relative}.kpi i{position:absolute;inset-inline-end:14px;top:14px;background:#fff;border-radius:8px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-style:normal}
.mt{display:flex;justify-content:space-between;align-items:center}
.ic{width:36px;height:36px;border-radius:50%;background:color-mix(in srgb,var(--pri) 12%,transparent);display:flex;align-items:center;justify-content:center;font-style:normal}
.mini hr{border:0;border-top:1px solid var(--line);margin:10px 0}.mini a{font-size:12px;color:var(--ink)}
.lgs{display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap}.lg{border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:13px}.lg b{display:block}
.bars2{display:flex;align-items:flex-end;gap:10px;height:200px;border-bottom:1px solid var(--line);padding:0 6px}
.bars2 .pr{flex:1;display:flex;align-items:flex-end;gap:3px;height:100%}.bars2 .pr div{flex:1;border-radius:4px 4px 0 0;min-height:2px}
@media print{.shell,.noprint{display:none!important}.modal{position:static;background:none;padding:0}.rcpt{max-height:none!important;overflow:visible!important}.modal>div{max-height:none!important;display:block!important}}
</style>
</head>

<script>

var SEED=[
 {id:1,name:'تيشيرت قطن',price:250,cost:140,barcode:'1001',v:[{s:'M',c:'أسود',q:8},{s:'L',c:'أسود',q:6},{s:'M',c:'أبيض',q:5},{s:'L',c:'أبيض',q:2}]},

 {id:3,name:'قميص رجالي',price:420,cost:240,barcode:'1003',v:[{s:'M',c:'سماوي',q:5},{s:'L',c:'سماوي',q:4},{s:'XL',c:'أبيض',q:1}]},
 {id:4,name:'فستان صيفي',price:780,cost:450,barcode:'1004',v:[{s:'S',c:'وردي',q:3},{s:'M',c:'وردي',q:4},{s:'M',c:'أخضر',q:2}]},

];
SEED.forEach(function(p){p.k='s'+p.id});
var db={products:SEED,sales:[],nextP:7,nextS:1};
try{var raw=localStorage.getItem(KEY);if(raw)db=JSON.parse(raw)}catch(e){}

function receipt(s){
  var d=new Date(s.date);
  $('modal').innerHTML='<div class="modal"><div><div class="rcpt" id="rc" style="width:'+(db.set.paper==='58'?58:80)+'mm"><div style="text-align:center">'+LOGO+'</div><h3>'+esc(db.set.name)+'</h3><div style="text-align:center;color:#555;font-size:12px">'+esc(db.set.addr||'')+' '+esc(db.set.phone||'')+'</div><div style="text-align:center">فاتورة رقم '+s.id+'</div><div style="text-align:center;color:#555">'+d.toLocaleString('ar-EG')+'</div><hr>'+
   s.items.map(function(i){return '<div class="r"><span>'+esc(i.name)+' ('+esc(i.s)+'/'+esc(i.c)+') × '+i.qty+'</span><span>'+money(i.price*i.qty)+'</span></div>'}).join('')+'<hr>'+
   (s.disc?'<div class="r"><span>خصم</span><span>'+money(s.disc)+'</span></div>':'')+'<div class="r"><b>الإجمالي</b><b>'+money(s.total)+'</b></div>'+(s.cr?'<div class="r"><span>مدفوع من الرصيد</span><span>'+money(s.cr)+'</span></div>':'')+(s.by?'<div class="r"><span>الكاشير</span><span>'+esc(s.by)+'</span></div>':'')+'<div class="r"><span>الدفع</span><span>'+esc(s.method)+'</span></div><hr><div style="text-align:center">شكراً لزيارتكم</div></div>'+
   '<div class="row noprint" style="justify-content:center"><button class="btn" onclick="doPrint(rcCss())">طباعة</button><button class="btn ghost" style="background:#fff;color:#111" onclick="$(\'modal\').innerHTML=\'\'">إغلاق</button></div></div></div>';
}

/* ---------- المنتجات ---------- */
function prodView(){
  var low=db.products.reduce(function(a,p){return a+p.v.filter(function(x){return x.q<=2}).length},0);
  $('app').innerHTML='<div class="stats"><div class="card stat"><span>عدد الأصناف</span><b>'+db.products.length+'</b></div><div class="card stat"><span>إجمالي القطع</span><b>'+db.products.reduce(function(a,p){return a+stock(p)},0)+'</b></div><div class="card stat"><span>مقاسات/ألوان قربت تخلص</span><b class="'+(low?'low':'')+'">'+low+'</b></div>'+(function(){var t=invTotals();return '<div class="card stat mgr"><span>قيمة المخزون (سعر الشراء)</span><b>'+money(t.c)+'</b></div><div class="card stat mgr"><span>قيمة المخزون (سعر البيع)</span><b>'+money(t.s)+'</b></div><div class="card stat mgr"><span>الربح المتوقع من المخزون</span><b>'+money(t.p)+'</b></div>'})()+'</div>'+
  '<div class="card mgr" style="margin-bottom:14px"><div class="ch"><h3 style="margin:0">إضافة منتج جديد</h3><div class="row" style="margin:0"><button class="btn ghost sm" onclick="impView()">📥 استيراد Excel</button><button class="btn ghost sm" onclick="bulkView()">💲 أسعار بالجملة</button></div></div><div class="form"><div><label>الاسم</label><input id="fn"></div><div><label>سعر البيع</label><input id="fp" type="number" min="0"></div><div><label>سعر الشراء</label><input id="fc" type="number" min="0"></div><div><label>الباركود</label><input id="fb" placeholder="اتركه فاضي للتوليد تلقائياً"></div><div><label>الكمية</label><input id="fq" type="number" min="0" value="0"></div><div><label>صورة المنتج</label><div class="row" style="margin:0"><input id="fi" type="file" accept="image/*" onchange="pickImg(this)"><button class="btn ghost" type="button" onclick="openCam()">📷 كاميرا</button></div><input id="fcam" type="file" accept="image/*" capture="environment" style="display:none" onchange="pickImg(this)">'+(draftImg?'<img id="fprev" class="pimg" src="'+draftImg+'">':'<img id="fprev" class="pimg" style="display:none">')+'</div></div>'+
  '<div class="chips">'+QS.map(function(z){return '<button type="button" class="chip'+(qsel.indexOf(z)>-1?' on':'')+'" onclick="qsTog(\''+z+'\')">'+z+'</button>'}).join('')+'</div><div class="form"><div><input id="qc" placeholder="اللون للمقاسات المحددة"></div><div><input id="qqt" type="number" min="0" placeholder="الكمية لكل مقاس"></div><div><button type="button" class="btn ghost" onclick="qsAdd()">+ أضف المقاسات المحددة</button></div></div><label>مقاسات وألوان (اختياري — لو الصنف له أكتر من مقاس أو لون، وهتتجاهل خانة الكمية)</label><div class="form"><input id="vs" placeholder="المقاس مثلاً M"><input id="vc" placeholder="اللون"><input id="vq" type="number" min="0" placeholder="الكمية"><button class="btn ghost" onclick="addV()">+ إضافة مقاس/لون</button></div>'+
  '<div class="chips">'+draftV.map(function(x,i){return '<span class="chip" onclick="draftV.splice('+i+',1);keep(prodView)">'+esc(x.s)+' / '+esc(x.c)+' ('+x.q+') ✕</span>'}).join('')+'</div><button class="btn" onclick="addProd()">حفظ المنتج</button></div>'+
  '<div class="card" style="overflow-x:auto"><table><tr><th>الصنف</th><th>السعر</th><th>الباركود</th><th>المخزون (مقاس/لون: كمية)</th><th></th></tr>'+
  db.products.map(function(p){return '<tr><td>'+(p.img?'<img class="pimg" src="'+p.img+'">':'')+esc(p.name)+'</td><td>'+money(p.price)+'</td><td>'+esc(p.barcode||'—')+'</td><td><div class="chips" style="margin:0">'+p.v.map(function(x,i){return '<span class="chip '+(x.q<=2?'low':'')+'">'+esc(x.s)+'/'+esc(x.c)+': '+x.q+' <a class="mgr" href="#" onclick="addStock('+p.id+','+i+');return false" title="زوّد الكمية">＋</a></span>'}).join('')+'</div></td><td><button class="btn ghost sm mgr" onclick="editProd('+p.id+')">تعديل</button> <button class="btn ghost sm" onclick="labelsView('+p.id+')">ملصقات</button> <button class="btn bad sm mgr" onclick="delProd('+p.id+')">حذف</button></td></tr>'}).join('')+'</table></div>';
}
function keep(fn){var f={};['fn','fp','fc','fb','fq','qc','qqt'].forEach(function(i){f[i]=$(i)&&$(i).value});fn();Object.keys(f).forEach(function(i){if($(i))$(i).value=f[i]||''})}
function addV(){var s=$('vs').value.trim(),c=$('vc').value.trim(),n=+$('vq').value;if(!s||!c||!(n>=0))return alert('اكتب المقاس واللون والكمية');keep(function(){draftV.push({s:s,c:c,q:n});prodView()})}
function addProd(){
  var n=$('fn').value.trim(),p=+$('fp').value;
  if(!n||!(p>0))return alert('اكتب اسم المنتج وسعر البيع');
  var qn=parseInt($('fq').value,10)||0;if(!draftV.length)draftV=[{s:'حر',c:'موحد',q:Math.max(0,qn)}];
  db.products.push({id:db.nextP++,name:n,price:p,cost:+$('fc').value||0,barcode:$('fb').value.trim()||String(1000+db.nextP),img:draftImg,v:draftV});draftImg='';
  draftV=[];save();prodView();
}
function addStock(pid,i){var n=parseInt(prompt('كام قطعة تضيف للمخزون؟','5'),10);if(n>0){find(pid).v[i].q+=n;save();prodView()}}
function delProd(id){if(confirm('تمسح المنتج ده؟')){db.products=db.products.filter(function(p){return p.id!==id});save();prodView()}}

/* ---------- المبيعات ---------- */
function salesView(){
  var today=new Date().toDateString();
  var ts=db.sales.filter(function(s){return new Date(s.date).toDateString()===today});
  var rev=ts.reduce(function(a,s){return a+s.total},0);
  var prof=ts.reduce(function(a,s){return a+s.total-s.items.reduce(function(b,i){return b+i.cost*i.qty},0)},0);
  $('app').innerHTML='<div class="stats"><div class="card stat"><span>مبيعات النهارده</span><b>'+money(rev)+'</b></div><div class="card stat"><span>عدد الفواتير</span><b>'+ts.length+'</b></div><div class="card stat mgr"><span>الربح التقريبي</span><b>'+money(prof)+'</b></div><div class="card stat"><span>إجمالي كل المبيعات</span><b>'+money(db.sales.reduce(function(a,s){return a+s.total},0))+'</b></div></div>'+
  '<div class="card" style="overflow-x:auto"><table><tr><th>رقم</th><th>الوقت</th><th>الأصناف</th><th>الدفع</th><th>الإجمالي</th><th></th></tr>'+
  (db.sales.length?db.sales.slice().reverse().map(function(s){return '<tr><td>'+s.id+'</td><td>'+new Date(s.date).toLocaleString('ar-EG')+'</td><td>'+s.items.map(function(i){return esc(i.name)+' ('+esc(i.s)+'/'+esc(i.c)+') ×'+i.qty}).join('<br>')+(s.items.length?'':'<small>ملغاة (مرتجعة بالكامل)</small>')+'</td><td>'+esc(s.method)+'</td><td>'+money(s.total)+'</td><td><button class="btn ghost sm" onclick="showR('+s.id+')">عرض</button> '+(s.due?'<button class="btn sm" onclick="collect('+s.id+')">تحصيل</button> ':'')+'<button class="btn bad sm mgr" onclick="retView('+s.id+')">مرتجع / استبدال</button></td></tr>'}).join(''):'<tr><td colspan="6" class="empty">لسه مفيش مبيعات. ابدأ أول فاتورة من شاشة الكاشير.</td></tr>')+'</table></div>';
}
function showR(id){receipt(db.sales.filter(function(s){return s.id===id})[0])}
function refund(id){
  if(!confirm('ترجّع الفاتورة كلها؟ هترجع القطع للمخزون.'))return;
  var s=db.sales.filter(function(x){return x.id===id})[0];
  s.items.forEach(function(i){var p=find(i.pid);if(p&&p.v[i.vi])p.v[i.vi].q+=i.qty});
  db.ret=(db.ret||0)+s.total;db.sales=db.sales.filter(function(x){return x.id!==id});save();salesView();
}
if(!GATED)showLoad();
</script>
</body>
</html>
